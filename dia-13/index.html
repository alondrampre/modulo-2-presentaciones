<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 1 - Miércoles: El Brand Board</title>
  
  <!-- Google Fonts: Arvo & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracotta: #bb371e;
      --teal: #058080;
      --dark-navy: #151f30;
      --coral: #ff7a48;
      --deep-blue: #103778;
      --yellow: #ffbb27;
      --white: #ffffff;
      --light-gray: #e2e8f0;
      --dark-card: #1c273a;
      
      --font-title: 'Arvo', serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-navy);
      color: var(--white);
      font-family: var(--font-body);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header#top-bar {
      height: 54px;
      background: rgba(16, 23, 38, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--terracotta);
      color: var(--white);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-weight: 600;
    }

    .class-title-header {
      font-size: 0.95rem;
      color: var(--light-gray);
      font-weight: 500;
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .btn-notes {
      background: rgba(5, 128, 128, 0.2);
      border-color: var(--teal);
      color: var(--teal);
    }

    .btn-notes:hover {
      background: var(--teal);
      color: var(--white);
    }

    /* Main Viewport */
    main#viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 50px;
      overflow: hidden;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 680px;
      background: var(--dark-card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 40px 50px 55px 50px;
      overflow: hidden;
    }

    /* Slide Header & Footer Indicators */
    .slide-indicator {
      position: absolute;
      top: 30px;
      right: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-num-badge {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--yellow);
      opacity: 0.9;
    }

    .slide-footer-bar {
      position: absolute;
      bottom: 25px;
      left: 50px;
      right: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    /* Slide Layouts */
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h2.slide-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 20px;
      line-height: 1.25;
      letter-spacing: -0.03em; /* Optical slab-serif spacing adjustment */
      font-kerning: normal;
    }

    .slide-body {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .slide-body ul {
      list-style-type: none;
      margin-top: 10px;
    }

    .slide-body ul li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
    }

    .slide-body ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.5rem;
      position: absolute;
      left: 4px;
      top: -4px;
    }

    .slide-body ol, .slide-content ol {
      margin-top: 12px;
      margin-left: 28px;
      padding-left: 0;
    }

    .slide-body ol li, .slide-content ol li {
      margin-bottom: 12px;
      line-height: 1.5;
      padding-left: 8px;
    }

    /* Title Layout */
    .layout-title {
      text-align: center;
      align-items: center;
    }

    .layout-title h2.slide-title {
      font-size: 2.8rem;
      color: var(--white);
      margin-bottom: 15px;
    }

    .class-pill {
      display: inline-block;
      background: rgba(255, 122, 72, 0.15);
      color: var(--coral);
      border: 1px solid var(--coral);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight-text {
      color: var(--yellow);
      font-weight: 600;
      margin-top: 15px;
    }

    /* Split Layout */
    .layout-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      height: 100%;
    }

    .media-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      overflow: hidden;
    }

    .media-container img {
      max-width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .diagram-canvas {
      width: 100%;
      max-height: 260px;
    }

    .image-placeholder {
      border: 2px dashed var(--teal);
      background: rgba(5, 128, 128, 0.08);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: var(--teal);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Grid Layout */
    .layout-grid-container {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--yellow);
    }

    .card-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .card-num {
      font-family: var(--font-title);
      color: var(--terracotta);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .card-title {
      font-family: var(--font-title);
      color: var(--yellow);
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--light-gray);
      line-height: 1.45;
    }

    .card-desc ul {
      list-style-type: none;
      margin-top: 8px;
      padding-left: 0;
    }

    .card-desc ul li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 8px !important;
      line-height: 1.4;
    }

    .card-desc ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.25rem;
      position: absolute;
      left: 2px;
      top: -2px;
    }

    /* Quote Layout */
    .layout-quote {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .quote-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--yellow);
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .quote-author {
      font-size: 1.1rem;
      color: var(--coral);
      font-weight: 600;
    }

    /* Bottom Controls */
    footer#bottom-controls {
      height: 60px;
      background: rgba(16, 23, 38, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--yellow));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--yellow);
      font-size: 1rem;
    }

    /* Speaker Notes Drawer (Aisladas de la diapositiva) */
    .notes-drawer {
      position: fixed;
      right: -420px;
      top: 54px;
      bottom: 60px;
      width: 400px;
      background: #111827;
      border-left: 2px solid var(--teal);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 25px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      right: 0;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notes-header h3 {
      font-family: var(--font-title);
      color: var(--teal);
      font-size: 1.1rem;
    }

    .close-notes-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-notes-btn:hover {
      color: var(--white);
    }

    .notes-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .notes-content h3 {
      color: var(--yellow);
      margin: 15px 0 8px 0;
      font-size: 1rem;
    }

    .notes-content p {
      margin-bottom: 12px;
    }

    /* ==========================================================================
       MODO PANTALLA COMPLETA: SOLO LA SLIDE (OCULTA BARRA SUPERIOR E INFERIOR)
       ========================================================================== */
    :fullscreen header#top-bar,
    :fullscreen footer#bottom-controls,
    :-webkit-full-screen header#top-bar,
    :-webkit-full-screen footer#bottom-controls {
      display: none !important;
    }

    :fullscreen main#viewport,
    :-webkit-full-screen main#viewport {
      padding: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      background: var(--dark-navy) !important;
    }

    :fullscreen .slide-wrapper,
    :-webkit-full-screen .slide-wrapper {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      padding: 60px 80px !important;
    }
  </style>
</head>
<body>

  <script>
    const slidesData = [
  {
    "layout": "title",
    "title": "El Brand Board: Compilación Visual",
    "subtitle": "Semana 7 • Miércoles • Clase 33",
    "content": "<p>Clase de Miércoles: Cómo compilar todo el sistema visual en una única lámina sintética coherente.</p>",

  },
  {
    "layout": "split",
    "title": "¿Qué es un Brand Board?",
    "content": "<p>La lámina resumen de identidad:</p><ul><li>Es un documento sintético de una sola página que compila todos los bloques constructivos del sistema visual.</li><li>Permite al cliente y a los desarrolladores ver la coherencia del sistema de un solo vistazo.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Brand Board</h3><p>El brand board actúa como un poster de la marca. Debe estar impecablemente diseñado.</p>"
  },
  {
    "layout": "split",
    "title": "Estructura y Diagramación",
    "content": "<p>Grilla de organización de la lámina:</p><ul><li>Divide el lienzo en secciones lógicas utilizando una retícula invisible.</li><li>Reserva el espacio dominante superior para la versión principal del logotipo.</li><li>Coloca en áreas complementarias las muestras cromáticas, fuentes, isotipo y patterns.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Nota</h3><p>La diagramación del brand board debe reflejar el mismo estilo de la marca.</p>"
  },
  {
    "layout": "split",
    "title": "Jerarquía de la Información",
    "content": "<p>Qué debe destacar de forma inmediata:</p><ul><li><strong>Nivel 1:</strong> El logotipo en gran tamaño para fijar las formas.</li><li><strong>Nivel 2:</strong> Las muestras de color y tipografías para entender la atmósfera.</li><li><strong>Nivel 3:</strong> Patterns, iconos y mockups de apoyo en menor escala.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Nota</h3><p>La jerarquía evita la confusión visual del cliente.</p>"
  },
  {
    "layout": "split",
    "title": "Brand Board vs. Moodboard",
    "content": "<p>Diferencias operativas de fase del proyecto:</p><ul><li><strong>Moodboard:</strong> Fase inicial. Recopilación de referencias visuales ajenas para definir el ánimo o estética general.</li><li><strong>Brand Board:</strong> Fase intermedia/final. Compilación de recursos propios vectorizados y terminados.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Comparación</h3><p>El moodboard es inspiración; el brand board es definición final.</p>"
  },
  {
    "layout": "split",
    "title": "Herramienta de Validación Rápida",
    "content": "<p>El valor estratégico en la presentación:</p><ul><li>Sirve como hoja de control para verificar que todos los recursos gráficos conviven en armonía cromática y tipográfica.</li><li>Es el paso previo a la redacción formal del manual de marca de decenas de páginas.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Tip</h3><p>El brand board permite realizar correcciones rápidas de paleta de forma muy simple.</p>"
  },
  {
    "layout": "split",
    "title": "Cómo definir el estilo del Board",
    "content": "<p>Coherencia con el universo de marca:</p><ul><li>Si tu marca es rústica y ecológica, la lámina del board debe usar fondos beige y espaciado orgánico.</li><li>Si es tecnológica, debe usar retícula rígida, alto contraste y fondos oscuros.</li></ul>",
    "media": "images/d13-miercoles-slide02.jpg",
    "notes": "<h3>Tip</h3><p>El diseño del board es en sí mismo una aplicación de la marca.</p>"
  },
  {
    "layout": "split",

    const currentDayIndex = 13;
    let currentIndex = 0;
    let notesOpen = false;

    const slideWrapper = document.getElementById('slide-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const slideCounter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const notesDrawer = document.getElementById('notes-drawer');
    const notesContent = document.getElementById('notes-content');
    const toggleNotesBtn = document.getElementById('toggle-notes-btn');
    const closeNotesBtn = document.getElementById('close-notes-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    // Index Modal Elements
    const indexModal = document.getElementById('index-modal');
    const toggleIndexBtn = document.getElementById('toggle-index-btn');
    const closeIndexBtn = document.getElementById('close-index-btn');
    const indexGrid = document.getElementById('index-grid');
    const idxPrevBtn = document.getElementById('idx-prev-btn');
    const idxNextBtn = document.getElementById('idx-next-btn');

    // Build the 20-day index grid dynamically
    indexGrid.innerHTML = courseDays.map(d => {
      const isActive = d.dayIndex === currentDayIndex;
      const highlightBorder = isActive ? 'border: 2px solid var(--yellow); box-shadow: 0 0 10px rgba(255, 187, 39, 0.25);' : 'border: 1px solid rgba(255, 255, 255, 0.08);';
      const badgeBg = isActive ? 'background: var(--yellow); color: #1c273a;' : 'background: var(--terracotta); color: var(--white);';
      const destination = isActive ? '#' : '../' + d.folderName + '/index.html';
      
      return `
        <a href="${destination}" style="
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 10px 14px;
          background: rgba(255, 255, 255, 0.04);
          border-radius: 8px;
          text-decoration: none;
          color: var(--white);
          transition: all 0.2s ease;
          min-height: 64px;
          box-sizing: border-box;
          ${highlightBorder}
        " onmouseover="this.style.background='rgba(255, 255, 255, 0.08)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.04)'">
          <div style="
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-title);
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
            ${badgeBg}
          ">${String(d.dayIndex).padStart(2, '0')}</div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;">
            <div style="
              font-size: 0.65rem;
              text-transform: uppercase;
              letter-spacing: 0.8px;
              color: rgba(255, 255, 255, 0.4);
              margin-bottom: 2px;
              font-weight: 700;
            ">${d.dayKey}</div>
            <div style="
              font-size: 0.82rem;
              font-weight: 500;
              color: var(--white);
              line-height: 1.25;
              overflow: hidden;
              text-overflow: ellipsis;
              display: -webkit-box;
              -webkit-line-clamp: 2;
              -webkit-box-orient: vertical;
              word-break: break-word;
            ">${d.dayTitle}</div>
          </div>
        </a>
      `;
    }).join('');

    // Setup Bottom Navigation links in the modal
    const prevDay = currentDayIndex > 1 ? courseDays[currentDayIndex - 2] : null;
    const nextDay = currentDayIndex < 20 ? courseDays[currentDayIndex] : null;

    if (prevDay) {
      idxPrevBtn.href = '../' + prevDay.folderName + '/index.html';
    } else {
      idxPrevBtn.style.opacity = '0.3';
      idxPrevBtn.style.pointerEvents = 'none';
    }

    if (nextDay) {
      idxNextBtn.href = '../' + nextDay.folderName + '/index.html';
    } else {
      idxNextBtn.style.opacity = '0.3';
      idxNextBtn.style.pointerEvents = 'none';
    }

    function toggleIndex() {
      const isHidden = indexModal.style.display === 'none' || indexModal.style.display === '';
      indexModal.style.display = isHidden ? 'flex' : 'none';
    }

    toggleIndexBtn.addEventListener('click', toggleIndex);
    closeIndexBtn.addEventListener('click', () => {
      indexModal.style.display = 'none';
    });
    indexModal.addEventListener('click', (e) => {
      if (e.target === indexModal) {
        indexModal.style.display = 'none';
      }
    });

    // Automatic extension fallback if image format differs (.png, .jpg, .svg, .webp)
    function handleImageError(img) {
      const cleanSrc = img.src.split('?')[0];
      if (!img.dataset.triedExt) {
        img.dataset.triedExt = 'png';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.png') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'png') {
        img.dataset.triedExt = 'jpg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.jpg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'jpg') {
        img.dataset.triedExt = 'svg';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.svg') + '?t=' + Date.now();
      } else if (img.dataset.triedExt === 'svg') {
        img.dataset.triedExt = 'webp';
        img.src = cleanSrc.replace(/\.(jpg|jpeg|png|webp|svg)$/i, '.webp') + '?t=' + Date.now();
      }
    }

    function renderSlide(index) {
      const slide = slidesData[index];
      const slideNum = String(index + 1).padStart(2, '0');
      
      let layoutHtml = '';

      if (slide.layout === 'title') {
        layoutHtml = `
          <div class="slide-content layout-title">
            <div class="class-pill">MÓDULO 2 &bull; DÍA 1</div>
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            ${slide.subtitle ? `<div class="highlight-text" style="margin-top:20px;">${slide.subtitle}</div>` : ''}
          </div>
        `;
      } else if (slide.layout === 'quote') {
        layoutHtml = `
          <div class="slide-content layout-quote">
            <div class="quote-text">“${slide.content}”</div>
            <div class="quote-author">— ${slide.title}</div>
          </div>
        `;
      } else if (slide.layout === 'split') {
        let mediaContent = '';
        if (slide.media) {
          const mediaSrc = slide.media.startsWith('images/') ? '../' + slide.media : slide.media;
          if (slide.media.trim().startsWith('<svg')) {
            mediaContent = slide.media;
          } else {
            mediaContent = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;">
              <img src="${mediaSrc}?t=${Date.now()}" onerror="handleImageError(this)" alt="${slide.title}" style="max-width:100%; max-height:300px; object-fit:cover; border-radius:8px;">
              ${slide.caption ? `<p style="font-size:0.76rem; color:rgba(255,255,255,0.45); margin-top:12px; text-align:center; line-height:1.4; font-family:var(--font-body); max-width:92%;">${slide.caption}</p>` : ''}
            </div>`;
          }
        } else {
          mediaContent = `<div class="image-placeholder">[IMAGEN: Ilus. o diagrama de ${slide.title}]</div>`;
        }

        layoutHtml = `
          <div class="layout-split">
            <div class="slide-content">
              <h2 class="slide-title">${slide.title}</h2>
              <div class="slide-body">${slide.content || ''}</div>
            </div>
            <div class="media-container">
              ${mediaContent}
            </div>
          </div>
        `;
      } else if (slide.layout === 'grid') {
        let cardsHtml = '';
        let gridCols = 'grid-3';
        if (slide.cards) {
          if (slide.cards.length === 2) gridCols = 'grid-2';
          else if (slide.cards.length === 4) gridCols = 'grid-4';

          cardsHtml = slide.cards.map(c => `
            <div class="card">
              ${c.icon ? `<div class="card-icon">${c.icon}</div>` : ''}
              ${c.num && !c.icon ? `<div class="card-num">${c.num}</div>` : ''}
              <div class="card-title">${c.title || c.text || ''}</div>
              <div class="card-desc">${c.desc}</div>
            </div>
          `).join('');
        }

        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
            <div class="layout-grid-container ${gridCols}">
              ${cardsHtml}
            </div>
          </div>
        `;
      } else {
        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
          </div>
        `;
      }

      slideWrapper.innerHTML = `
        <div class="slide-indicator">
          <span class="slide-num-badge">${slideNum}</span>
        </div>
        ${layoutHtml}
        <div class="slide-footer-bar">
          <span>Miércoles: El Brand Board</span>
          <span>Día 13</span>
        </div>
      `;

      // Update speaker notes
      notesContent.innerHTML = slide.notes || '<p>No hay notas adicionales para esta diapositiva.</p>';

      // Update controls
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slidesData.length - 1;
      slideCounter.textContent = `${slideNum} / ${String(slidesData.length).padStart(2, '0')}`;
      progressBar.style.width = `${((index + 1) / slidesData.length) * 100}%`;
    }

    function goToNext() {
      if (currentIndex < slidesData.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    // Navigation Events
    nextBtn.addEventListener('click', goToNext);
    prevBtn.addEventListener('click', goToPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        goToNext();
      } else if (e.key === 'ArrowLeft') {
        goToPrev();
      } else if (e.key.toLowerCase() === 'p') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'i') {
        toggleIndex();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Notes drawer toggle
    function toggleNotes() {
      notesOpen = !notesOpen;
      notesDrawer.classList.toggle('open', notesOpen);
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    closeNotesBtn.addEventListener('click', () => {
      notesOpen = false;
      notesDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Initial Render
    renderSlide(currentIndex);
  </script>
