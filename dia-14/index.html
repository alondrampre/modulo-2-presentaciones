<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Día 14 - Jueves: Brand Guidelines: Reglas y Prohibiciones</title>
  
  <!-- Google Fonts: Arvo & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --terracotta: #bb371e;
      --teal: #058080;
      --dark-navy: #151f30;
      --coral: #ff7a48;
      --deep-blue: #103778;
      --yellow: #ffbb27;
      --white: #ffffff;
      --light-gray: #e2e8f0;
      --dark-card: #1c273a;
      
      --font-title: 'Arvo', serif;
      --font-body: 'Space Grotesk', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--dark-navy);
      color: var(--white);
      font-family: var(--font-body);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header#top-bar {
      height: 54px;
      background: rgba(16, 23, 38, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 10;
    }

    .brand-title {
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      background: var(--terracotta);
      color: var(--white);
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-weight: 600;
    }

    .class-title-header {
      font-size: 0.95rem;
      color: var(--light-gray);
      font-weight: 500;
    }

    .top-controls {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      padding: 6px 14px;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .btn-notes {
      background: rgba(5, 128, 128, 0.2);
      border-color: var(--teal);
      color: var(--teal);
    }

    .btn-notes:hover {
      background: var(--teal);
      color: var(--white);
    }

    /* Main Viewport */
    main#viewport {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 50px;
      overflow: hidden;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 680px;
      background: var(--dark-card);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 40px 50px 55px 50px;
      overflow: hidden;
    }

    /* Slide Header & Footer Indicators */
    .slide-indicator {
      position: absolute;
      top: 30px;
      right: 35px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slide-num-badge {
      font-family: var(--font-title);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--yellow);
      opacity: 0.9;
    }

    .slide-footer-bar {
      position: absolute;
      bottom: 25px;
      left: 50px;
      right: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 15px;
    }

    /* Slide Layouts */
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h2.slide-title {
      font-family: var(--font-title);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--white);
      margin-bottom: 20px;
      line-height: 1.25;
      letter-spacing: -0.03em; /* Optical slab-serif spacing adjustment */
      font-kerning: normal;
    }

    .slide-body {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .slide-body ul {
      list-style-type: none;
      margin-top: 10px;
    }

    .slide-body ul li {
      position: relative;
      padding-left: 24px;
      margin-bottom: 12px;
    }

    .slide-body ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.5rem;
      position: absolute;
      left: 4px;
      top: -4px;
    }

    .slide-body ol, .slide-content ol {
      margin-top: 12px;
      margin-left: 28px;
      padding-left: 0;
    }

    .slide-body ol li, .slide-content ol li {
      margin-bottom: 12px;
      line-height: 1.5;
      padding-left: 8px;
    }

    /* Title Layout */
    .layout-title {
      text-align: center;
      align-items: center;
    }

    .layout-title h2.slide-title {
      font-size: 2.8rem;
      color: var(--white);
      margin-bottom: 15px;
    }

    .class-pill {
      display: inline-block;
      background: rgba(255, 122, 72, 0.15);
      color: var(--coral);
      border: 1px solid var(--coral);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .highlight-text {
      color: var(--yellow);
      font-weight: 600;
      margin-top: 15px;
    }

    /* Split Layout */
    .layout-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
      height: 100%;
    }

    .media-container {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      overflow: hidden;
    }

    .media-container img {
      max-width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .diagram-canvas {
      width: 100%;
      max-height: 260px;
    }

    .image-placeholder {
      border: 2px dashed var(--teal);
      background: rgba(5, 128, 128, 0.08);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      color: var(--teal);
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Grid Layout */
    .layout-grid-container {
      display: grid;
      gap: 14px;
      margin-top: 12px;
    }

    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: var(--yellow);
    }

    .card-icon {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .card-num {
      font-family: var(--font-title);
      color: var(--terracotta);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .card-title {
      font-family: var(--font-title);
      color: var(--yellow);
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--light-gray);
      line-height: 1.45;
    }

    .card-desc ul {
      list-style-type: none;
      margin-top: 8px;
      padding-left: 0;
    }

    .card-desc ul li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 8px !important;
      line-height: 1.4;
    }

    .card-desc ul li::before {
      content: '•';
      color: var(--coral);
      font-size: 1.25rem;
      position: absolute;
      left: 2px;
      top: -2px;
    }

    /* Quote Layout */
    .layout-quote {
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .quote-text {
      font-family: var(--font-title);
      font-size: 1.8rem;
      color: var(--yellow);
      font-style: italic;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .quote-author {
      font-size: 1.1rem;
      color: var(--coral);
      font-weight: 600;
    }

    /* Bottom Controls */
    footer#bottom-controls {
      height: 60px;
      background: rgba(16, 23, 38, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--white);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--terracotta);
      border-color: var(--terracotta);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .progress-bar-container {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin: 0 20px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--teal), var(--yellow));
      width: 0%;
      transition: width 0.3s ease;
    }

    .slide-counter {
      font-family: var(--font-title);
      font-weight: 700;
      color: var(--yellow);
      font-size: 1rem;
    }

    /* Speaker Notes Drawer (Aisladas de la diapositiva) */
    .notes-drawer {
      position: fixed;
      right: -420px;
      top: 54px;
      bottom: 60px;
      width: 400px;
      background: #111827;
      border-left: 2px solid var(--teal);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 25px;
      overflow-y: auto;
    }

    .notes-drawer.open {
      right: 0;
    }

    .notes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .notes-header h3 {
      font-family: var(--font-title);
      color: var(--teal);
      font-size: 1.1rem;
    }

    .close-notes-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-notes-btn:hover {
      color: var(--white);
    }

    .notes-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--light-gray);
    }

    .notes-content h3 {
      color: var(--yellow);
      margin: 15px 0 8px 0;
      font-size: 1rem;
    }

    .notes-content p {
      margin-bottom: 12px;
    }

    /* ==========================================================================
       MODO PANTALLA COMPLETA: SOLO LA SLIDE (OCULTA BARRA SUPERIOR E INFERIOR)
       ========================================================================== */
    :fullscreen header#top-bar,
    :fullscreen footer#bottom-controls,
    :-webkit-full-screen header#top-bar,
    :-webkit-full-screen footer#bottom-controls {
      display: none !important;
    }

    :fullscreen main#viewport,
    :-webkit-full-screen main#viewport {
      padding: 0 !important;
      height: 100vh !important;
      width: 100vw !important;
      max-width: none !important;
      max-height: none !important;
      background: var(--dark-navy) !important;
    }

    :fullscreen .slide-wrapper,
    :-webkit-full-screen .slide-wrapper {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      padding: 60px 80px !important;
    }
  
    /* Animation for slides loading */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-wrapper { position: relative; overflow: hidden; }
    .slide-content, .layout-split, .layout-grid-container, .layout-steps-container, .layout-vs-container, .layout-stat-container {
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .card, .step-item, .vs-column, .stat-box {
      opacity: 0;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .card:nth-child(1), .step-item:nth-child(1), .vs-column:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2), .step-item:nth-child(2), .vs-column:nth-child(2) { animation-delay: 0.2s; }
    .card:nth-child(3), .step-item:nth-child(3) { animation-delay: 0.3s; }
    .card:nth-child(4), .step-item:nth-child(4) { animation-delay: 0.4s; }
    
    .layout-vs-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 30px; }
    .vs-column { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 28px; position: relative; }
    .vs-column.highlighted { border-color: var(--yellow); background: rgba(255, 187, 39, 0.02); }
    .vs-badge { position: absolute; top: -12px; left: 20px; background: var(--yellow); color: #151f30; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; padding: 4px 12px; border-radius: 20px; letter-spacing: 1px; }
    .vs-badge.second { background: var(--teal); color: var(--white); }
    .vs-title { font-family: var(--font-title); font-size: 1.4rem; color: var(--white); margin-bottom: 16px; }
    
    .layout-steps-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .step-item { background: rgba(255, 255, 255, 0.03); border-left: 4px solid var(--teal); padding: 20px; border-radius: 0 12px 12px 0; }
    .step-number { font-family: var(--font-title); font-size: 2.2rem; color: var(--yellow); line-height: 1; margin-bottom: 8px; font-weight: 700; }
    .step-title { font-weight: 600; font-size: 1.05rem; color: var(--white); margin-bottom: 6px; }
    
    .layout-stat-container { display: flex; align-items: center; justify-content: space-between; gap: 40px; margin-top: 40px; }
    .stat-number { font-family: var(--font-title); font-size: 8rem; font-weight: 700; color: var(--yellow); line-height: 1; letter-spacing: -4px; text-shadow: 0 10px 30px rgba(255, 187, 39, 0.15); }
    .stat-box { flex: 1; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 36px; }
    
    .layout-highlight-box { background: linear-gradient(135deg, rgba(5, 128, 128, 0.25) 0%, rgba(21, 31, 48, 0.8) 100%); border: 1.5px solid var(--teal); padding: 32px; border-radius: 16px; margin-top: 30px; box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4); }

</style>
</head>

  <script>
    const slidesData = [
  {
    "layout": "title",
    "title": "Brand Guidelines: Reglas y Prohibiciones",
    "subtitle": "Semana 7 • Jueves • Clase 34",
    "content": "<p>Clase de Jueves: Áreas de resguardo, tamaños mínimos y catálogo de usos incorrectos en el manual.</p>",
    "notes": "<h3>Apertura</h3><p>Hoy veremos cómo blindar la marca. Definiremos las reglas y prohibiciones necesarias para evitar deformaciones por terceros.</p>"
  },
  {
    "layout": "split",
    "title": "Agenda de la Clase",

              <div class="stat-number">${slide.number}</div>
              <div class="stat-box">
                <div style="font-size: 1.15rem; font-weight:600; color:var(--white); margin-bottom:12px;">${slide.statTitle || ''}</div>
                <div style="font-size: 0.95rem; line-height:1.6; color:rgba(255,255,255,0.7);">${slide.content}</div>
              </div>
            </div>
          </div>
        `;
      } else if (slide.layout === 'highlight') {
        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="layout-highlight-box">
              <div style="font-size: 1.15rem; font-weight:600; color:var(--yellow); margin-bottom:12px;">${slide.highlightTitle || 'Concepto clave'}</div>
              <div style="font-size: 1rem; line-height:1.6; color:var(--white);">${slide.content}</div>
            </div>
          </div>
        `;
      } else {
        layoutHtml = `
          <div class="slide-content">
            <h2 class="slide-title">${slide.title}</h2>
            <div class="slide-body">${slide.content || ''}</div>
          </div>
        `;
      }

      slideWrapper.innerHTML = `
        <div class="slide-indicator">
          <span class="slide-num-badge">${slideNum}</span>
        </div>
        ${layoutHtml}
        <div class="slide-footer-bar">
          <span>Jueves: Brand Guidelines: Reglas y Prohibiciones</span>
          <span>Día 14</span>
        </div>
      `;

      // Update speaker notes
      notesContent.innerHTML = slide.notes || '<p>No hay notas adicionales para esta diapositiva.</p>';

      // Update controls
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slidesData.length - 1;
      slideCounter.textContent = `${slideNum} / ${String(slidesData.length).padStart(2, '0')}`;
      progressBar.style.width = `${((index + 1) / slidesData.length) * 100}%`;
    }

    function goToNext() {
      if (currentIndex < slidesData.length - 1) {
        currentIndex++;
        renderSlide(currentIndex);
      }
    }

    function goToPrev() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide(currentIndex);
      }
    }

    // Navigation Events
    nextBtn.addEventListener('click', goToNext);
    prevBtn.addEventListener('click', goToPrev);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        goToNext();
      } else if (e.key === 'ArrowLeft') {
        goToPrev();
      } else if (e.key.toLowerCase() === 'p') {
        toggleNotes();
      } else if (e.key.toLowerCase() === 'i') {
        toggleIndex();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Notes drawer toggle
    function toggleNotes() {
      notesOpen = !notesOpen;
      notesDrawer.classList.toggle('open', notesOpen);
    }

    toggleNotesBtn.addEventListener('click', toggleNotes);
    closeNotesBtn.addEventListener('click', () => {
      notesOpen = false;
      notesDrawer.classList.remove('open');
    });

    // Fullscreen toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // Initial Render
    renderSlide(currentIndex);
  </script>
</body>
</html>
